<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة القيادة | منظومة hm-ya</title>
    <link rel="stylesheet" href="css/theme.css">
    <style>
        .dashboard { display: grid; grid-template-columns: 1fr 3fr; gap: 20px; padding: 20px; }
        .panel { padding: 20px; border: var(--gold-border); background: var(--surface-secondary); border-radius: 8px; }
        .btn-danger { background: #800000; color: #fff; border: 1px solid red; padding: 15px; width: 100%; cursor: pointer; font-size: 18px; border-radius: 5px; text-shadow: 1px 1px 2px #000; box-shadow: 0 0 15px rgba(255,0,0,0.3); transition: 0.3s; }
        .btn-danger:hover { background: #a00000; box-shadow: 0 0 25px rgba(255,0,0,0.6); }
        .voice-controls { margin-top: 20px; display: flex; gap: 10px; }
        .btn-voice { background: transparent; border: 1px solid var(--typography-gold); color: var(--typography-gold); padding: 10px; cursor: pointer; flex: 1; border-radius: 5px;}
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="panel">
            <h3 class="emperor-title">صلاحيات الإمبراطور</h3>
            <ul style="list-style:none; padding:0; color:var(--typography-light); line-height:2.5;">
                <li>✓ إدارة الشبكة</li>
                <li>✓ صلاحيات التوثيق</li>
                <li>✓ الرقابة المركزية</li>
            </ul>
        </div>
        <div class="panel">
            <h2>مركز التحكم الاستراتيجي</h2>
            <button class="btn-danger" id="expandBtn">🚀 تفعيل نظام التوسع (Expansion System)</button>
            
            <div class="module-container" style="margin-top: 30px;">
                <h3 style="border:none;">🎙️ نظام المراسلة الصوتية</h3>
                <div class="voice-controls">
                    <button class="btn-voice" id="startRecord">🔴 بدء التسجيل</button>
                    <button class="btn-voice" id="stopRecord" disabled>⏹️ إيقاف</button>
                </div>
                <audio id="audioPlayback" controls style="width: 100%; margin-top: 15px; display: none;"></audio>
            </div>
        </div>
    </div>
    <script src="js/voice_system.js"></script>
    <script>
        document.getElementById('expandBtn').addEventListener('click', () => {
            alert('تم إطلاق بروتوكولات نظام التوسع بنجاح في جميع الخوادم!');
        });
    </script>
</body>
</html>
